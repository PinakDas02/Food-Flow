<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Flow - Sign Up</title>
    <link rel="stylesheet" href="signup.css">

   

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="main-container">

    <!-- Left Section -->
    <div class="left-section">

        <div class="logo">
            <h1>
               <span class="food">𝓯𝓸𝓸𝓭</span><sub
                class="flow"> 𝓕𝓵𝓸𝔀</sub>
            </h1>

            <p>𝙁𝙧𝙚𝙨𝙝 𝙁𝙤𝙤𝙙, 𝙌𝙪𝙞𝙘𝙠 𝙎𝙚𝙧𝙫𝙞𝙘𝙚, 𝘽𝙚𝙩𝙩𝙚𝙧 𝘿𝙖𝙮𝙨.</p>
        </div>

        <div class="welcome">
            <h2>𝓒𝓻𝓮𝓪𝓽𝓮 𝓨𝓸𝓾𝓻 <span>𝓐𝓬𝓬𝓸𝓾𝓷𝓽</span></h2>

            <p>
                𝑱𝒐𝒊𝒏 𝑭𝒐𝒐𝒅 𝑭𝒍𝒐𝒘 𝒂𝒏𝒅 𝒆𝒏𝒋𝒐𝒚 𝒂 𝒔𝒎𝒂𝒓𝒕𝒆𝒓 𝒄𝒂𝒏𝒕𝒆𝒆𝒏 𝒆𝒙𝒑𝒆𝒓𝒊𝒆𝒏𝒄𝒆!
            </p>
        </div>

        <div class="food-image">
             
             </div>

    </div>


    <!-- Right Section -->
    <div class="right-section">

        <div class="signup-box">

            <div class="signup-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>

            <h2>Sign <span>Up</span></h2>

            <form id="signupForm">

                <!-- Full Name -->
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>

                    <input type="text"
                           placeholder="Full Name"
                           required>
                </div>

                <!-- Mobile Number -->
                <div class="input-box">
                    <i class="fa-solid fa-phone"></i>

                    <input type="tel"
                           id="mobile"
                           placeholder="Mobile Number"
                           maxlength="10"
                           pattern="[0-9]{10}"
                           required>
                </div>

                <!-- Password -->
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>

                    <input type="password"
                           id="password"
                           placeholder="Password"
                           required>

                    <i class="fa-solid fa-eye toggle"
                       onclick="togglePassword('password', this)"></i>
                </div>

                <!-- Confirm Password -->
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>

                    <input type="password"
                           id="confirmPassword"
                           placeholder="Confirm Password"
                           required>

                    <i class="fa-solid fa-eye toggle"
                       onclick="togglePassword('confirmPassword', this)"></i>
                </div>

                <!-- Sign Up Button -->
                <button type="submit" class="signup-btn">
                    <i class="fa-solid fa-user-plus"></i>
                    Sign Up
                </button>

            </form>

            <!-- OR -->
            <div class="or">
                <span></span>
                OR
                <span></span>
            </div>

            <!-- Login Link -->
            <p class="login-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

</div>
</body>
</html>
