<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Flow - Contact Us</title>

    <link rel="stylesheet" href="contact.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>

    <!-- Navbar Start -->

    <header class="navbar">

        <a href="index.html" class="logo">
             <img src="image/logo.jpg" alt="Food Flow Logo">
            
            <span>Food <b>Flow</b></span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="myorder.html">My Order</a>
            <a href="mycart.html">My Cart</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="admin.html">Admin</a>
        </nav>

        <div class="nav-buttons">
            <a href="login.html" class="login-btn">
                <i class="fa-solid fa-user"></i> Login
            </a>

            <a href="signup.html" class="signup-btn">
                <i class="fa-solid fa-user-plus"></i> Sign Up
            </a>
        </div>

    </header>

    <!-- Navbar End -->


    <!-- Contact Section Start -->

    <section class="contact-section">

        <div class="section-title">
            <i class="fa-solid fa-envelope"></i>

            <div>
                <h1>Contact <span>Us</span></h1>
                <p>We'd love to hear from you</p>
            </div>
        </div>


        <div class="contact-container">

            <!-- Left Contact Information -->

            <div class="contact-info">

                <div class="info-box">

                    <div class="info-icon">
                        <i class="fa-solid fa-phone"></i>
                    </div>

                    <div>
                        <h3>Call Us</h3>
                        <p>+91 98765 43210</p>
                        <small>Mon - Fri, 9AM - 9PM</small>
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-icon">
                        <i class="fa-solid fa-envelope"></i>
                    </div>

                    <div>
                        <h3>Email Us</h3>
                        <p>foodflow@gmail.com</p>
                        <small>We reply within 24h</small>
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-icon">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>

                    <div>
                        <h3>Our Location</h3>
                        <p>AIU Campus</p>
                        <small>Computer Applications Dept.</small>
                    </div>

                </div>


                <!-- Social Media -->

                <div class="social-section">

                    <h3>Follow Us</h3>

                    <div class="social-icons">

                        <a href="#" class="facebook">
                            <i class="fa-brands fa-facebook-f"></i>
                        </a>

                        <a href="#" class="instagram">
                            <i class="fa-brands fa-instagram"></i>
                        </a>

                    </div>

                </div>

            </div>


            <!-- Right Contact Form -->

            <div class="contact-form">

                <form action="#" method="post">

                    <input
                    type="text"
                    name="name"
                    placeholder="Your Name"
                    required>

                    <input
                    type="email"
                    name="email"
                    placeholder="Your Email"
                    required>

                    <input
                    type="text"
                    name="subject"
                    placeholder="Your Subject"
                    required>

                    <textarea
                    name="message"
                    placeholder="Your Message..."
                    rows="5"
                    required></textarea>

                    <button type="submit">
                        Send Message
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                </form>

            </div>

        </div>

    </section>

</body>
</html>
