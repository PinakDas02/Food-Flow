<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Flow - Login</title>
    <link rel="stylesheet" href="auth.css">
</head>
     <body>
        <div class="login-container">
            <div class="food-section">
                <div class="logo">
                    <span>food</span>
                    <small>FLOW</small>
                    <div class="logo-line"></div>
                </div>

                <div class="food-content">
                    <img src="image/login food.jpg.png" alt="Delicious Food" class="food-image">
                </div>

                </div>
        
        <div class="login-section">

            <div class="login-card">
            <h1>Login</h1>
            <div class="heading-line"></div>

    <form id="loginForm">

        <div class="form-group">

        <label for="username">Username</label>
        <div class="input-box">
            <span class="input-icon"></span>
        <input type="text" id="username"
               placeholder="Enter Username"
               required>
        </div>
        </div>   

        <div class="form-group">

        <label for="password">Password</label>
        <div class="input-box">
            <span class="input-icon"></span>
        <input type="password" id="password"
               placeholder="Enter Password"
               required>

               <button type="button" id="togglePassword" class="eye-button></button>
        </div>
        </div> 

        <div class="options">

            <label class="remember">
                <input type="checkbox" id="remember">
                <span>Remember Me</span>
            </label>
            <a href="#" id="forgotPassword">Forgot Password?</a>
        </div>  
        <button type="submit" class="login-btn">Login<span></span>
        </button>
    </form>
        <p class="signup-text">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>     
    
                </div>
             </div>
         </div>
    </body>
</html>
